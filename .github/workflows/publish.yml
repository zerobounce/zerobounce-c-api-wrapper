name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        type: string
        description: Tag to publish (e.g. v2.1.2)
        required: true

permissions:
  contents: read

jobs:
  validate-tag:
    outputs:
      tag_sha: ${{ steps.tag_sha.outputs.sha }}
    name: Validate tag
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag input
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          re='^v[0-9]+\.[0-9]+\.[0-9]+([.+-][0-9A-Za-z.-]+)?$'
          if [[ ! "$TAG" =~ $re ]]; then
            echo "Error: the tag input must be a release tag such as v1.2.3 (with the leading v)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: refs/tags/${{ github.event.inputs.tag }}
          persist-credentials: false
      - name: Verify tag and project version
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            echo "Error: Tag is required."
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Error: Tag '$TAG' does not exist."
            exit 1
          fi
          TAG_VERSION="${TAG#v}"
          PKG_VERSION=$(grep -E '^project\(ZeroBounce VERSION ' CMakeLists.txt | sed -E 's/.*VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          if [ -z "$PKG_VERSION" ]; then
            echo "Error: Could not read version from CMakeLists.txt"
            exit 1
          fi
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Error: CMakeLists.txt version ($PKG_VERSION) does not match tag ($TAG)."
            exit 1
          fi
      - name: Record tag commit SHA
        id: tag_sha
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          SHA=$(git rev-parse "refs/tags/$TAG^{commit}")
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: [validate-tag]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-tag.outputs.tag_sha }}
          persist-credentials: false

      - name: Verify checked-out commit
        env:
          EXPECTED_SHA: ${{ needs.validate-tag.outputs.tag_sha }}
        run: |
          if [ -z "$EXPECTED_SHA" ]; then
            echo "Error: the validated tag commit SHA is empty."
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]; then
            echo "Error: checked-out commit does not match the validated tag commit."
            exit 1
          fi
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake libssl-dev

      - name: Configure and build
        run: cmake -S . -B build -G "Unix Makefiles" && cmake --build build

      - name: Run tests
        run: |
          ./build/bin/ZeroBounceTests
          ./build/bin/ZeroBounceTransportTests

      - name: Build as a FetchContent consumer
        # A project that pulls this repository in with FetchContent links the
        # library only: it must not fetch unity or fff, or define the test targets.
        # The parent build's _deps are reused so nothing is downloaded twice.
        run: |
          deps="$GITHUB_WORKSPACE/build/_deps"
          consumer="$RUNNER_TEMP/consumer"
          mkdir -p "$consumer"
          cat > "$consumer/CMakeLists.txt" <<'EOF'
          cmake_minimum_required(VERSION 3.21)
          project(ZeroBounceConsumer LANGUAGES C)
          include(FetchContent)
          FetchContent_Declare(zerobounce GIT_REPOSITORY https://example.invalid/zerobounce.git)
          FetchContent_MakeAvailable(zerobounce)
          add_executable(consumer main.c)
          target_link_libraries(consumer PRIVATE ZeroBounce)
          EOF
          cat > "$consumer/main.c" <<'EOF'
          #include "ZeroBounce/ZeroBounce.h"

          int main(void) {
              void (*init)(ZeroBounce *, const char *) = zero_bounce_initialize;
              return init == 0;
          }
          EOF
          cmake -S "$consumer" -B "$consumer/build" -G "Unix Makefiles" \
            -DFETCHCONTENT_FULLY_DISCONNECTED=ON \
            -DFETCHCONTENT_SOURCE_DIR_ZEROBOUNCE="$GITHUB_WORKSPACE" \
            -DFETCHCONTENT_SOURCE_DIR_LIBCURL="$deps/libcurl-src" \
            -DFETCHCONTENT_SOURCE_DIR_JSON-C="$deps/json-c-src"
          cmake --build "$consumer/build" --target consumer
          # FETCHCONTENT_FULLY_DISCONNECTED only warns about a missing unity-src on
          # CMake 3.21, so look for the cache entries of a FetchContent_MakeAvailable
          # of unity or fff instead: they exist only when the library's
          # PROJECT_IS_TOP_LEVEL guard is gone.
          if grep -E 'FETCHCONTENT_SOURCE_DIR_(UNITY|FFF)' "$consumer/build/CMakeCache.txt"; then
            echo "::error::A FetchContent consumer fetched unity or fff."
            exit 1
          fi
          if ! targets=$(cmake --build "$consumer/build" --target help); then
            echo "::error::cmake --build --target help failed in the FetchContent consumer."
            exit 1
          fi
          if printf '%s\n' "$targets" | grep -E 'ZeroBounceTests|ZeroBounceTransportTests|ZeroBounceIncludeOnly'; then
            echo "::error::A FetchContent consumer defines a test target."
            exit 1
          fi

  release:
    name: Create GitHub Release
    needs: [validate-tag, test]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-tag.outputs.tag_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag }}
          EXPECTED_SHA: ${{ needs.validate-tag.outputs.tag_sha }}
        run: |
          if [ -z "$EXPECTED_SHA" ]; then
            echo "Error: the validated tag commit SHA is empty."
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --verify-tag \
              --target "$EXPECTED_SHA" \
              --generate-notes
          fi
