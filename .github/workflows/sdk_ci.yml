# Build and run the Unity tests on a pull request, on a push to main, and on a manual dispatch.
name: SDK CI

on:
  # Started by dependabot-auto-merge.yml after it merges: a merge made with GITHUB_TOKEN
  # starts no push workflows.
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake libssl-dev

      - name: Configure and build
        run: cmake -S . -B build -G "Unix Makefiles" && cmake --build build

      - name: Run tests
        run: |
          ./build/bin/ZeroBounceTests
          ./build/bin/ZeroBounceTransportTests

      - name: Build as a FetchContent consumer
        # A project that pulls this repository in with FetchContent links the
        # library only: it must not fetch unity or fff, or define the test targets.
        # The parent build's _deps are reused so nothing is downloaded twice.
        run: |
          deps="$GITHUB_WORKSPACE/build/_deps"
          consumer="$RUNNER_TEMP/consumer"
          mkdir -p "$consumer"
          cat > "$consumer/CMakeLists.txt" <<'EOF'
          cmake_minimum_required(VERSION 3.21)
          project(ZeroBounceConsumer LANGUAGES C)
          include(FetchContent)
          FetchContent_Declare(zerobounce GIT_REPOSITORY https://example.invalid/zerobounce.git)
          FetchContent_MakeAvailable(zerobounce)
          add_executable(consumer main.c)
          target_link_libraries(consumer PRIVATE ZeroBounce)
          EOF
          cat > "$consumer/main.c" <<'EOF'
          #include "ZeroBounce/ZeroBounce.h"

          int main(void) {
              void (*init)(ZeroBounce *, const char *) = zero_bounce_initialize;
              return init == 0;
          }
          EOF
          cmake -S "$consumer" -B "$consumer/build" -G "Unix Makefiles" \
            -DFETCHCONTENT_FULLY_DISCONNECTED=ON \
            -DFETCHCONTENT_SOURCE_DIR_ZEROBOUNCE="$GITHUB_WORKSPACE" \
            -DFETCHCONTENT_SOURCE_DIR_LIBCURL="$deps/libcurl-src" \
            -DFETCHCONTENT_SOURCE_DIR_JSON-C="$deps/json-c-src"
          cmake --build "$consumer/build" --target consumer
          # FETCHCONTENT_FULLY_DISCONNECTED only warns about a missing unity-src on
          # CMake 3.21, so look for the cache entries of a FetchContent_MakeAvailable
          # of unity or fff instead: they exist only when the library's
          # PROJECT_IS_TOP_LEVEL guard is gone.
          if grep -E 'FETCHCONTENT_SOURCE_DIR_(UNITY|FFF)' "$consumer/build/CMakeCache.txt"; then
            echo "::error::A FetchContent consumer fetched unity or fff."
            exit 1
          fi
          if ! targets=$(cmake --build "$consumer/build" --target help); then
            echo "::error::cmake --build --target help failed in the FetchContent consumer."
            exit 1
          fi
          if printf '%s\n' "$targets" | grep -E 'ZeroBounceTests|ZeroBounceTransportTests|ZeroBounceIncludeOnly'; then
            echo "::error::A FetchContent consumer defines a test target."
            exit 1
          fi

  test-min-cmake:
    # Builds and tests with the oldest CMake the project supports. 3.21 is the
    # floor because CMAKE_C_STANDARD 17 is new in CMake 3.21; 3.20 cannot
    # configure. Keep MIN_CMAKE at cmake_minimum_required in CMakeLists.txt.
    name: Test (minimum CMake 3.21.0)
    runs-on: ubuntu-latest
    env:
      MIN_CMAKE: "3.21.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libssl-dev python3-venv

      - name: Install CMake ${{ env.MIN_CMAKE }}
        run: |
          python3 -m venv "$RUNNER_TEMP/cmake-venv"
          "$RUNNER_TEMP/cmake-venv/bin/pip" install --disable-pip-version-check "cmake==$MIN_CMAKE"
          echo "$RUNNER_TEMP/cmake-venv/bin" >> "$GITHUB_PATH"

      - name: Check CMake version
        run: |
          cmake --version
          test "$(cmake --version | head -n 1)" = "cmake version $MIN_CMAKE"

      - name: Configure and build
        run: cmake -S . -B build -G "Unix Makefiles" && cmake --build build

      - name: Run tests
        run: |
          ./build/bin/ZeroBounceTests
          ./build/bin/ZeroBounceTransportTests
