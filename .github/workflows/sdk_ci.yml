# Build and run Unity tests on every PR.
name: SDK CI

on:
  # Started by dependabot-auto-merge.yml after it merges: a merge made with GITHUB_TOKEN
  # starts no push workflows.
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake libssl-dev

      - name: Configure and build
        run: cmake -S . -B build -G "Unix Makefiles" && cmake --build build

      - name: Run tests
        run: |
          ./build/bin/ZeroBounceTests
          ./build/bin/ZeroBounceTransportTests

  test-min-cmake:
    # Builds and tests with the oldest CMake the project supports. 3.21 is the
    # floor because CMAKE_C_STANDARD 17 is new in CMake 3.21; 3.20 cannot
    # configure. Keep MIN_CMAKE at cmake_minimum_required in CMakeLists.txt.
    name: Test (minimum CMake 3.21.0)
    runs-on: ubuntu-latest
    env:
      MIN_CMAKE: "3.21.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libssl-dev python3-venv

      - name: Install CMake ${{ env.MIN_CMAKE }}
        run: |
          python3 -m venv "$RUNNER_TEMP/cmake-venv"
          "$RUNNER_TEMP/cmake-venv/bin/pip" install --disable-pip-version-check "cmake==$MIN_CMAKE"
          echo "$RUNNER_TEMP/cmake-venv/bin" >> "$GITHUB_PATH"

      - name: Check CMake version
        run: |
          cmake --version
          test "$(cmake --version | head -n 1)" = "cmake version $MIN_CMAKE"

      - name: Configure and build
        run: cmake -S . -B build -G "Unix Makefiles" && cmake --build build

      - name: Run tests
        run: |
          ./build/bin/ZeroBounceTests
          ./build/bin/ZeroBounceTransportTests
